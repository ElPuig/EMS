name: Clean changelog/ (manual)

# Comment "/changelog-clean" on a PR to remove the changelog/ folder (working-draft PR notes
# - see CLAUDE.md's "PR changelog" section) from that PR's own branch via an automated
# commit, meant to be run once, right before merging. Named (file and command both) to match
# require-changelog-clean.yml's "changelog-clean" job/required-check name exactly - renamed
# from the original "/clean-changelog" 2026-07-31 so what you type matches what you see in
# the PR checks list, without needing to touch branch protection's required-check config
# (that string was already "changelog-clean"). Deliberately does NOT use a "[skip ci]"-style
# commit message: that would skip every workflow for this commit, including
# ci-unit-testing.yml (whose own changelog-only-push detection is what keeps this fast,
# instead of skipping it outright and risking a required check stuck pending forever).
#
# Same authorization pattern as deploy-check.yml: requires the repo secret TEAM_READ_TOKEN
# to verify the commenter belongs to the "Integrators" team before pushing anything.
#
# Only works for PRs from a branch in this same repository (not a fork) - the default
# GITHUB_TOKEN cannot push to a fork's branch.
#
# The push itself needs a second secret, CHANGELOG_CLEANUP_TOKEN: the "Block v18.0*" repo
# ruleset blocks any push updating a "v18.0*" branch - including the still-active integration
# branch this workflow targets, not just an already-released one - for everyone except its own
# bypass list. GitHub does not offer "GitHub Actions"/the default GITHUB_TOKEN as a selectable
# bypass actor at all (only repo roles, specific Teams, and a handful of built-in Apps like
# Dependabot) - confirmed 2026-09-01 trying to add it. CHANGELOG_CLEANUP_TOKEN must therefore be
# a fine-grained PAT (Contents: read and write, this repo only) belonging to a real user who IS
# on the ruleset's bypass Team - the checkout step below authenticates with it instead of the
# default token specifically so the push is attributed to (and authorized as) that user.
#
# Result is reported as a commit status, context "changelog-clean-run" (changed 2026-09-02;
# deliberately a different context than require-changelog-clean.yml's own "changelog-clean"
# required check, so this never overwrites that one). Previously this posted a PR comment
# instead - homogeneous with every other check on this repo (a tick, not a chat message) is
# preferable, and a comment had already proven itself unreliable in practice: it reported
# "removed and pushed" purely from whether the local `git rm` succeeded, with no regard for
# whether the push itself worked, so it once announced success on a run whose push had
# actually failed (CHANGELOG_CLEANUP_TOKEN had Contents:Read-only permission at the time).

on:
  issue_comment:
    types: [created]

jobs:
  authorize:
    if: github.event.issue.pull_request && github.event.comment.body == '/changelog-clean'
    runs-on: ubuntu-latest
    outputs:
      is_member: ${{ steps.check.outputs.is_member }}
    steps:
      - name: Check Integrators team membership
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEAM_READ_TOKEN }}
          script: |
            const username = context.payload.comment.user.login;
            try {
              const res = await github.rest.teams.getMembershipForUserInOrg({
                org: context.repo.owner,
                team_slug: 'integrators',
                username,
              });
              const isMember = res.data.state === 'active';
              core.setOutput('is_member', isMember ? 'true' : 'false');
              core.info(`${username} membership state: ${res.data.state}`);
            } catch (err) {
              core.setOutput('is_member', 'false');
              core.info(`${username} is not a member of Integrators (${err.message})`);
            }

  clean:
    needs: authorize
    if: needs.authorize.outputs.is_member == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: read
    steps:
      - name: Resolve PR head branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            // Set outputs BEFORE the fork check below, not after: a step that fails via
            // core.setFailed() keeps whatever outputs it already set, and the final
            // reporting step needs `sha` to attach a failure status even for a fork PR.
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('This PR is from a fork - cannot push the cleanup commit back to it.');
            }

      - name: Checkout PR branch
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
          # See the file header note: the default GITHUB_TOKEN can never push past the
          # "Block v18.0*" ruleset, so every git operation in this job (including the push
          # below) needs to authenticate as a real, bypass-listed user instead.
          token: ${{ secrets.CHANGELOG_CLEANUP_TOKEN }}

      - name: Remove changelog/
        id: remove
        run: |
          if [ -d changelog ] && [ -n "$(ls -A changelog 2>/dev/null)" ]; then
            git rm -r changelog
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog/ is already empty or absent - nothing to do."
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        id: push
        if: steps.remove.outputs.removed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove changelog/ before merge"
          git push origin HEAD:${{ steps.pr.outputs.ref }}
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result as a commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const originalSha = '${{ steps.pr.outputs.sha }}';
            if (!originalSha) {
              // Couldn't even resolve the PR's head commit (e.g. the pulls.get call itself
              // errored) - nothing to attach a status to.
              core.warning('No PR head sha resolved; skipping commit status.');
              return;
            }

            let sha = originalSha, state, description;
            if ('${{ steps.pr.outcome }}' === 'failure') {
              state = 'failure';
              description = 'This PR is from a fork, or the PR could not be resolved - see the run log.';
            } else if ('${{ steps.checkout.outcome }}' === 'failure') {
              state = 'failure';
              description = 'Checkout of the PR branch failed - see the run log.';
            } else if ('${{ steps.remove.outcome }}' !== 'success') {
              state = 'failure';
              description = 'Unexpected error before changelog/ could be inspected - see the run log.';
            } else if ('${{ steps.remove.outputs.removed }}' !== 'true') {
              state = 'success';
              description = 'changelog/ was already empty - nothing to remove.';
            } else if ('${{ steps.push.outcome }}' === 'success') {
              state = 'success';
              sha = '${{ steps.push.outputs.new_sha }}' || originalSha;
              description = 'changelog/ removed and pushed to this branch.';
            } else {
              state = 'failure';
              description = 'changelog/ removed locally but the push failed - likely CHANGELOG_CLEANUP_TOKEN needs attention.';
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha, state, context: 'changelog-clean-run', description,
            });
