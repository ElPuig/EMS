name: "CI: Unit Testing"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Install and test on Ubuntu 24.04
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout EMS
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # This required check must always run and record a real result (never be skipped by
      # GitHub's own path filtering), or it risks getting stuck "pending" forever and
      # blocking merges even when everything is fine - see require-changelog-clean.yml's own
      # comment for the same gotcha. So instead of filtering this workflow's trigger, detect
      # here whether the push that triggered this specific run only touched changelog/
      # (the working-draft PR notes folder - see CLAUDE.md's "PR changelog" section, cleaned
      # up via the "/clean-changelog" comment command right before merging) and skip the
      # expensive steps below for that one case, while still letting the job succeed.
      - name: Detect changelog-only push
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changelog_only=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^changelog/'; then
              echo "changelog_only=true" >> "$GITHUB_OUTPUT"
              echo "This push only touches changelog/ - skipping the full test suite for this run."
            else
              echo "changelog_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changelog_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg python3-pip \
            $(grep -v '^#' apt-requirements.txt)

      # Required to run the browser (tour) tests — mirrors the "Only under development
      # environments" section of README.md, so CI exercises the same tours a developer
      # would run locally instead of silently skipping them for missing dependencies.
      - name: Install browser test dependencies (websocket-client, Chrome)
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          sudo pip install --break-system-packages websocket-client
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable

      # Ubuntu 24.04 runner images restrict unprivileged user namespaces via AppArmor
      # by default, which breaks Chrome's crashpad_handler even with --no-sandbox
      # (Odoo already passes --no-sandbox itself): it fails with
      # "crashpad/util/linux/socket.cc: recvmsg: Connection reset by peer" and the
      # tour test then times out waiting for the devtools port. See
      # https://github.com/actions/runner-images/issues/9491.
      - name: Allow unprivileged user namespaces for Chrome sandboxing
        if: steps.diff.outputs.changelog_only != 'true'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install Odoo v18 from official repository
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          wget -q -O - https://nightly.odoo.com/odoo.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/odoo-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/odoo-archive-keyring.gpg] \
            https://nightly.odoo.com/18.0/nightly/deb/ ./" \
            | sudo tee /etc/apt/sources.list.d/odoo.list
          sudo apt-get update -qq && sudo apt-get install -y odoo

      - name: Stop and disable Odoo system service
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          sudo systemctl stop odoo || true
          sudo systemctl disable odoo || true

      - name: Copy EMS module and set permissions
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          sudo mkdir -p /opt/modules
          sudo cp -r "$GITHUB_WORKSPACE" /opt/modules/ems
          sudo chown -R odoo:odoo /opt/modules

      - name: Configure Odoo
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          sudo tee /etc/odoo/odoo.conf > /dev/null <<'EOF'
          [options]
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/modules,/opt/modules/queue,/opt/modules/partner-contact
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          server_wide_modules = web,queue_job
          EOF

      - name: Install EMS module
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          set -o pipefail
          sudo /opt/modules/ems/install.sh 2>&1 | tee /tmp/odoo-install.log

      - name: Update external dependencies
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          sudo /opt/modules/ems/update.sh

      - name: Upgrade EMS module
        if: steps.diff.outputs.changelog_only != 'true'
        run: |
          set -o pipefail
          sudo /opt/modules/ems/upgrade.sh 2>&1 | tee /tmp/odoo-upgrade.log

      - name: Run EMS tests
        if: steps.diff.outputs.changelog_only != 'true'
        env:
          # Raises Chrome's own internal log verbosity (odoo/tests/common.py passes this as
          # --v=<level> to the browser). Level 0 (Odoo's default) only logs the last gasp before
          # a crash (e.g. the crashpad_handler "recvmsg: Connection reset by peer" line seen on
          # tour test failures) with no context on what caused it; level 1 keeps the noise
          # manageable while surfacing the browser-process-level lines (missing libraries, GPU
          # init, renderer state) that precede it, which is exactly what's missing to diagnose
          # those failures further.
          ODOO_BROWSER_LOG_VERBOSITY: "1"
        run: |
          set -o pipefail
          sudo /opt/modules/ems/test.sh 2>&1 | tee /tmp/odoo-test.log

      - name: Collect Chrome/system logs for failed tour tests
        if: always() && steps.diff.outputs.changelog_only != 'true'
        run: |
          # odoo/tests/common.py's ChromeBrowser.stop() already saves the browser's own
          # chrome_debug.log (odoo.tools.config['screenshots'], defaulting to /tmp/odoo_tests)
          # whenever a tour test fails after Chrome started — but not on the "Chrome never
          # started" path (_spawn_chrome deletes user_data_dir, log included, before raising),
          # where the log is only visible inline in /tmp/odoo-test.log. Copy whatever Odoo did
          # save, plus a dmesg tail (to catch an OOM-kill of the Chrome process, which would
          # explain the crash reporter itself also failing to connect), so both are on the
          # uploaded artifact instead of only the runner's ephemeral filesystem.
          sudo mkdir -p /tmp/odoo-chrome-logs
          sudo cp -r /tmp/odoo_tests/. /tmp/odoo-chrome-logs/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/odoo-chrome-logs
          sudo dmesg --time-format iso 2>/dev/null | tail -300 > /tmp/dmesg-tail.log || true

      - name: Upload logs
        if: always() && steps.diff.outputs.changelog_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: odoo-logs
          path: |
            /tmp/odoo-install.log
            /tmp/odoo-upgrade.log
            /tmp/odoo-test.log
            /tmp/odoo-chrome-logs
            /tmp/dmesg-tail.log
          if-no-files-found: ignore
