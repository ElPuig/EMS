name: "CI: Unit Testing"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Computes two things once, shared by every shard below: whether this push only touched
  # changelog/ (see the "Detect changelog-only push" step) and the dynamic test-shard matrix
  # (scripts/testing/compute_test_shards.py - self-maintaining, discovers tests/*_tour.py at
  # run time so a new tour file is picked up automatically, no workflow edit needed).
  plan:
    name: Plan test shards
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      changelog_only: ${{ steps.diff.outputs.changelog_only }}
    steps:
      - name: Checkout EMS
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # This required check must always run and record a real result (never be skipped by
      # GitHub's own path filtering), or it risks getting stuck "pending" forever and
      # blocking merges even when everything is fine - see require-changelog-clean.yml's own
      # comment for the same gotcha. So instead of filtering this workflow's trigger, detect
      # here whether the push that triggered this specific run only touched changelog/
      # (the working-draft PR notes folder - see CLAUDE.md's "PR changelog" section, cleaned
      # up via the "/changelog-clean" comment command right before merging) and skip the
      # expensive steps below for that one case, while still letting every job succeed.
      - name: Detect changelog-only push
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changelog_only=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^changelog/'; then
              echo "changelog_only=true" >> "$GITHUB_OUTPUT"
              echo "This push only touches changelog/ - skipping the full test suite for this run."
            else
              echo "changelog_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changelog_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute test shards
        id: shards
        run: echo "matrix=$(python3 scripts/testing/compute_test_shards.py)" >> "$GITHUB_OUTPUT"

  # One shard = one full "install Odoo + EMS" runner running a subset of test classes, in
  # parallel with every other shard - see scripts/testing/compute_test_shards.py for how the
  # subsets are chosen (one "fast" shard with everything except browser tours, split evenly
  # across N "tour-*" shards). Each shard duplicates the install/setup cost (unavoidable on
  # GitHub-hosted runners without a shared filesystem between jobs), but that cost runs
  # concurrently across shards instead of stacking sequentially - this repo's GitHub repo is
  # public, so the extra Actions minutes this duplication uses are free (see CLAUDE.md/chat
  # history 2026-07-31), only wall-clock time is what's actually being optimized here.
  test:
    name: "Test (${{ matrix.name }})"
    needs: plan
    if: needs.plan.outputs.changelog_only != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout EMS
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg python3-pip \
            $(grep -v '^#' apt-requirements.txt)

      # Required to run the browser (tour) tests — mirrors the "Only under development
      # environments" section of README.md, so CI exercises the same tours a developer
      # would run locally instead of silently skipping them for missing dependencies. Skipped
      # entirely for the "fast" shard, which runs zero tour/HttpCase tests and so never
      # touches a browser - a real, if modest, extra speedup this matrix split makes possible
      # that the old single-job workflow couldn't have (every test used to share one process,
      # so Chrome always had to be installed regardless of which tests actually needed it).
      - name: Install browser test dependencies (websocket-client, Chrome)
        if: matrix.needs_chrome
        run: |
          sudo pip install --break-system-packages websocket-client
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable

      # Ubuntu 24.04 runner images restrict unprivileged user namespaces via AppArmor
      # by default, which breaks Chrome's crashpad_handler even with --no-sandbox
      # (Odoo already passes --no-sandbox itself): it fails with
      # "crashpad/util/linux/socket.cc: recvmsg: Connection reset by peer" and the
      # tour test then times out waiting for the devtools port. See
      # https://github.com/actions/runner-images/issues/9491.
      - name: Allow unprivileged user namespaces for Chrome sandboxing
        if: matrix.needs_chrome
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install Odoo v18 from official repository
        run: |
          wget -q -O - https://nightly.odoo.com/odoo.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/odoo-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/odoo-archive-keyring.gpg] \
            https://nightly.odoo.com/18.0/nightly/deb/ ./" \
            | sudo tee /etc/apt/sources.list.d/odoo.list
          sudo apt-get update -qq && sudo apt-get install -y odoo

      - name: Stop and disable Odoo system service
        run: |
          sudo systemctl stop odoo || true
          sudo systemctl disable odoo || true

      - name: Copy EMS module and set permissions
        run: |
          sudo mkdir -p /opt/modules
          sudo cp -r "$GITHUB_WORKSPACE" /opt/modules/ems
          sudo chown -R odoo:odoo /opt/modules

      - name: Configure Odoo
        run: |
          # 'secret' is required by EmsCompany._get_fernet_key() (models/settings/company.py)
          # to encrypt/decrypt company-level credentials (LimeSurvey password, Google
          # Workspace service account JSON) - any test touching those fields raises
          # "Unable to locate a 'secret' value within odoo.conf" without it (confirmed via a
          # real CI run, 2026-07-31 - TestCompanySettings and TestLimesurveyApi's whole
          # setUpClass both failed on this). A fresh random Fernet key is fine here since
          # this database is thrown away at the end of the job - it only needs to stay the
          # same *within* this one run, not match production's or persist across runs.
          SECRET=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          sudo tee /etc/odoo/odoo.conf > /dev/null <<EOF
          [options]
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/modules,/opt/modules/queue,/opt/modules/partner-contact
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          server_wide_modules = web,queue_job
          secret = ${SECRET}
          EOF

      - name: Install EMS module
        run: |
          set -o pipefail
          sudo /opt/modules/ems/install.sh 2>&1 | tee /tmp/odoo-install.log

      - name: Update external dependencies
        run: |
          sudo /opt/modules/ems/update.sh

      - name: Upgrade EMS module
        run: |
          set -o pipefail
          sudo /opt/modules/ems/upgrade.sh 2>&1 | tee /tmp/odoo-upgrade.log

      - name: Run EMS tests (${{ matrix.name }})
        env:
          # Raises Chrome's own internal log verbosity (odoo/tests/common.py passes this as
          # --v=<level> to the browser). Level 0 (Odoo's default) only logs the last gasp before
          # a crash (e.g. the crashpad_handler "recvmsg: Connection reset by peer" line seen on
          # tour test failures) with no context on what caused it; level 1 keeps the noise
          # manageable while surfacing the browser-process-level lines (missing libraries, GPU
          # init, renderer state) that precede it, which is exactly what's missing to diagnose
          # those failures further.
          ODOO_BROWSER_LOG_VERBOSITY: "1"
        run: |
          set -o pipefail
          sudo /opt/modules/ems/test.sh "${{ matrix.tags }}" 2>&1 | tee /tmp/odoo-test.log

      - name: Collect Chrome/system logs for failed tour tests
        if: always() && matrix.needs_chrome
        run: |
          # odoo/tests/common.py's ChromeBrowser.stop() already saves the browser's own
          # chrome_debug.log (odoo.tools.config['screenshots'], defaulting to /tmp/odoo_tests)
          # whenever a tour test fails after Chrome started — but not on the "Chrome never
          # started" path (_spawn_chrome deletes user_data_dir, log included, before raising),
          # where the log is only visible inline in /tmp/odoo-test.log. Copy whatever Odoo did
          # save, plus a dmesg tail (to catch an OOM-kill of the Chrome process, which would
          # explain the crash reporter itself also failing to connect), so both are on the
          # uploaded artifact instead of only the runner's ephemeral filesystem.
          sudo mkdir -p /tmp/odoo-chrome-logs
          sudo cp -r /tmp/odoo_tests/. /tmp/odoo-chrome-logs/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/odoo-chrome-logs
          sudo dmesg --time-format iso 2>/dev/null | tail -300 > /tmp/dmesg-tail.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-logs-${{ matrix.name }}
          path: |
            /tmp/odoo-install.log
            /tmp/odoo-upgrade.log
            /tmp/odoo-test.log
            /tmp/odoo-chrome-logs
            /tmp/dmesg-tail.log
          if-no-files-found: ignore

  # A matrix job's own check name changes per matrix value (e.g. "Test (tour-2)"), which
  # branch protection would treat as a brand-new, never-configured check per shard - this
  # lightweight aggregator exists so there's a single, stable check reflecting "did the whole
  # matrix pass," with the real work split into parallel shards underneath it.
  #
  # Named "Test (all)" (job id stays "ci" - only the reported `name:` matters for display and
  # for what branch protection's required-status-check rule matches on) so it reads as one of
  # the "Test (...)" family above instead of an unrelated one-word outlier (developer feedback
  # 2026-07-31). Renamed from the earlier "ci" - a required-check rename, so branch
  # protection's required context needs the matching GitHub-side update in the same breath
  # (see chat history 2026-07-31 for the exact API call) or the old "ci" string orphans
  # permanently, same class of mistake as the "Install and test on Ubuntu 24.04" orphan found
  # and fixed earlier this session.
  ci:
    name: "Test (all)"
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check all shards passed
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::One or more test shards failed (aggregate result: $result) - see the 'Test (...)' jobs above."
            exit 1
          fi
          echo "All test shards passed (aggregate result: $result)."
