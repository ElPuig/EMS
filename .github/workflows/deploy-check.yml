name: Deploy Check (manual)

# Manual, on-demand gate: comment "/deploy-check" on a PR to run the EMS
# upgrade against a throwaway copy of the current production database,
# using the PR's code. Meant to be run once, right before merging/squashing
# - not on every push (that would put unnecessary load on the production
# host, which is also the self-hosted runner used below).
#
# Requires a repo secret TEAM_READ_TOKEN: a token with permission to read
# organization team membership (a fine-grained PAT scoped to
# "Members: Read-only" is enough), used to verify the commenter belongs to
# the "Integrators" team before anything runs on the production runner.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # This job only exists so the "deploy-check" status shown in the PR's checks list carries
  # a description telling the developer HOW to run it - a plain commit status (unlike a
  # check-run) has no clickable annotation to read instructions from, and with nothing posted
  # here it would otherwise sit as GitHub's generic "Expected — waiting for status to be
  # reported" with no hint that a "/deploy-check" PR comment is what it's waiting for.
  announce-pending:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post pending status with instructions
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha, state: 'pending',
              context: 'deploy-check',
              description: '/deploy-check (comment this on this PR to run a deploy check).',
            });

  authorize:
    if: github.event.issue.pull_request && github.event.comment.body == '/deploy-check'
    runs-on: ubuntu-latest
    outputs:
      is_member: ${{ steps.check.outputs.is_member }}
    steps:
      - name: Check Integrators team membership
        id: check
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.TEAM_READ_TOKEN }}
          script: |
            const username = context.payload.comment.user.login;
            try {
              const res = await github.rest.teams.getMembershipForUserInOrg({
                org: context.repo.owner,
                team_slug: 'integrators',
                username,
              });
              const isMember = res.data.state === 'active';
              core.setOutput('is_member', isMember ? 'true' : 'false');
              core.info(`${username} membership state: ${res.data.state}`);
            } catch (err) {
              core.setOutput('is_member', 'false');
              core.info(`${username} is not a member of Integrators (${err.message})`);
            }

  staging-upgrade-check:
    needs: authorize
    if: needs.authorize.outputs.is_member == 'true'
    runs-on: self-hosted
    concurrency:
      group: deploy-check
      cancel-in-progress: true
    steps:
      - name: Resolve PR head commit
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);

      - name: Mark check as pending
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}', state: 'pending',
              context: 'deploy-check',
              description: 'Running upgrade dry-run against production data...',
            });

      - name: Checkout PR head commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          # This repo IS the 'ems' module (__manifest__.py at its root), so it must land in a
          # subdirectory named 'ems' - addons_path below points at the parent, exactly like
          # production's odoo.conf (addons_path = ..., /root/myModules, ...) resolves the module
          # via /root/myModules/ems/__manifest__.py. Checking out straight into 'pr-checkout' and
          # pointing addons_path at that folder made Odoo unable to find a module named 'ems' at
          # all, so '-u ems' silently no-opped instead of failing - see the 2026-07-12 incident
          # where this let a broken pre-migrate.py through as a false green.
          path: pr-checkout/ems

      - name: Write isolated odoo config
        run: |
          cat <<EOF | sudo tee /tmp/odoo-deploy-check.conf
          [options]
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,${{ github.workspace }}/pr-checkout,/root/myModules/queue,/root/myModules/partner-contact
          EOF

      - name: Clone production data into a scratch database
        run: |
          sudo -u odoo dropdb --if-exists ems_pr_check
          sudo -u odoo createdb ems_pr_check
          sudo -u odoo bash -c "pg_dump --no-owner -d ems | psql -q -d ems_pr_check"

          # Odoo resolves attachment content from filestore/<dbname>/..., keyed off the *database*
          # name, not the module - ir_attachment rows copied above still point at hashes that only
          # exist under filestore/ems/. Without this, reading any attachment (e.g. the company logo,
          # touched during the very first module-list refresh) raises FileNotFoundError, which Odoo
          # swallows by marking 'ems' as "not installable, skipped" instead of failing the run - a
          # false green that never actually loads the module under test (2026-07-12 incident).
          sudo -u odoo rm -rf /var/lib/odoo/.local/share/Odoo/filestore/ems_pr_check
          sudo -u odoo cp -r /var/lib/odoo/.local/share/Odoo/filestore/ems /var/lib/odoo/.local/share/Odoo/filestore/ems_pr_check

      - name: Dry-run the EMS upgrade
        id: dryrun
        run: |
          set -o pipefail
          sudo -u odoo bash -c "odoo -d ems_pr_check -u ems --stop-after-init -c /tmp/odoo-deploy-check.conf" 2>&1 | tee /tmp/odoo-deploy-check.log

          # Odoo's own exit code is not a reliable pass/fail signal: a module that fails while
          # loading (missing attachment, dependency graph issue, ...) can end up silently marked
          # "not installable, skipped" while the rest of the stock modules still load fine - the
          # process then still exits 0 for --stop-after-init. That let two different real bugs
          # through as false greens on 2026-07-12. Verify what actually happened in the DB instead
          # of trusting the exit code.
          expected_version=$(grep -oP "'version':\s*'\K[^']+" pr-checkout/ems/__manifest__.py)
          actual_state=$(sudo -u odoo psql -d ems_pr_check -t -c "SELECT state || ' ' || latest_version FROM ir_module_module WHERE name='ems';" | xargs)
          echo "Expected: installed ${expected_version} | Actual: ${actual_state}"
          if [ "$actual_state" != "installed ${expected_version}" ]; then
            echo "::error::EMS module did not end up 'installed ${expected_version}' in the dry-run (got: '${actual_state}') - see the uploaded log."
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          sudo -u odoo dropdb --if-exists ems_pr_check
          sudo -u odoo rm -rf /var/lib/odoo/.local/share/Odoo/filestore/ems_pr_check

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-check-log
          path: /tmp/odoo-deploy-check.log

      - name: Report result on the commit
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ steps.dryrun.outcome }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}', state,
              context: 'deploy-check',
              description: state === 'success' ? 'Upgrade dry-run passed' : 'Upgrade dry-run failed - see logs',
            });
