name: Install Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Install and test on Ubuntu 24.04
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout EMS
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg \
            python3-lxml python3-lxml-html-clean python3-phonenumbers

      - name: Install Odoo v18 from official repository
        run: |
          wget -q -O - https://nightly.odoo.com/odoo.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/odoo-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/odoo-archive-keyring.gpg] \
            https://nightly.odoo.com/18.0/nightly/deb/ ./" \
            | sudo tee /etc/apt/sources.list.d/odoo.list
          sudo apt-get update -qq && sudo apt-get install -y odoo

      - name: Clone OCA dependencies (depth 1)
        run: |
          sudo mkdir -p /opt/modules
          sudo git clone --depth 1 --branch 18.0 \
            https://github.com/OCA/queue.git /opt/modules/queue
          sudo git clone --depth 1 --branch 18.0 \
            https://github.com/OCA/partner-contact.git /opt/modules/partner-contact

      - name: Copy EMS module and set permissions
        run: |
          sudo cp -r "$GITHUB_WORKSPACE" /opt/modules/ems
          sudo chown -R odoo:odoo /opt/modules

      - name: Configure Odoo
        run: |
          sudo tee /etc/odoo/odoo.conf > /dev/null <<'EOF'
          [options]
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/modules,/opt/modules/queue,/opt/modules/partner-contact
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          server_wide_modules = web,queue_job
          EOF

      - name: Install EMS module (core of install.sh)
        run: |
          sudo -u odoo odoo -d ems --stop-after-init -i ems \
            -c /etc/odoo/odoo.conf --without-demo=WITHOUT_DEMO \
            2>&1 | tee /tmp/odoo-install.log

          echo "--- Scanning log for errors ---"
          if grep -qE "[0-9]{4}-[0-9]{2}-[0-9]{2} .+(ERROR|CRITICAL)" /tmp/odoo-install.log; then
            echo "INSTALL FAILED — errors found:"
            grep -E "[0-9]{4}-[0-9]{2}-[0-9]{2} .+(ERROR|CRITICAL)" /tmp/odoo-install.log
            exit 1
          fi
          echo "Install completed — no errors detected."

      - name: Upgrade EMS module (core of upgrade.sh)
        run: |
          sudo -u odoo bash -c "PGPASSWORD=odoo psql -h localhost -U odoo -d ems \
            -c \"UPDATE queue_job SET state='pending' WHERE state IN ('started', 'enqueued');\""

          sudo -u odoo odoo -d ems -u ems --i18n-overwrite \
            --stop-after-init -c /etc/odoo/odoo.conf --dev=all \
            2>&1 | tee /tmp/odoo-upgrade.log

          echo "--- Scanning log for errors ---"
          if grep -qE "[0-9]{4}-[0-9]{2}-[0-9]{2} .+(ERROR|CRITICAL)" /tmp/odoo-upgrade.log; then
            echo "UPGRADE FAILED — errors found:"
            grep -E "[0-9]{4}-[0-9]{2}-[0-9]{2} .+(ERROR|CRITICAL)" /tmp/odoo-upgrade.log
            exit 1
          fi
          echo "Upgrade completed — no errors detected."

      - name: Run EMS tests
        run: |
          sudo -u odoo odoo -d ems -u ems --test-enable --test-tags=/ems \
            --stop-after-init -c /etc/odoo/odoo.conf \
            2>&1 | tee /tmp/odoo-test.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo "--- Scanning test log for errors ---"
          if grep -qE "ERROR ems odoo\.(addons|modules|tests)" /tmp/odoo-test.log; then
            echo "TESTS FAILED — errors found:"
            grep -E "ERROR ems odoo\.(addons|modules|tests)" /tmp/odoo-test.log
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "TESTS FAILED — odoo exited with code $EXIT_CODE"
            exit 1
          fi
          echo "All tests passed."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-logs
          path: |
            /tmp/odoo-install.log
            /tmp/odoo-upgrade.log
            /tmp/odoo-test.log
