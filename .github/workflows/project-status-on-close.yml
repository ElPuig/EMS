name: Board status on issue close

# Sets the issue's card on the project board (ElPuig project 4) according to why
# it was closed. The board's built-in "Item closed" workflow can only send every
# closed issue to one column, so it must stay disabled: cancelled issues would
# otherwise land with the completed ones.
#
# Needs the repository secret PROJECTS_TOKEN: a token with the organization
# permission "Projects: Read and write" (GITHUB_TOKEN can't write to an
# organization project).

on:
  issues:
    types: [closed]

jobs:
  set-status:
    runs-on: ubuntu-latest

    steps:
      - name: Move the card to Cancelled or Merged
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          PROJECT_ID: PVT_kwDOAeND7M4AIJY5
          STATUS_FIELD_ID: PVTSSF_lADOAeND7M4AIJY5zgFHZA4
          OPTION_CANCELLED: df6f7ff4
          OPTION_MERGED: 911d43ff
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PROJECTS_TOKEN is missing (needs organization Projects: Read and write)."
            exit 1
          fi

          case "$STATE_REASON" in
            not_planned|duplicate) OPTION="$OPTION_CANCELLED"; LABEL="Cancelled" ;;
            *)                     OPTION="$OPTION_MERGED";    LABEL="Merged" ;;
          esac
          echo "Issue #$ISSUE_NUMBER closed as '${STATE_REASON:-unknown}' -> $LABEL"

          # The issue's card on this board, if it already has one.
          ITEM_ID=$(gh api graphql -f query='
            query($issue: ID!) {
              node(id: $issue) {
                ... on Issue {
                  projectItems(first: 50) { nodes { id project { id } } }
                }
              }
            }' -f issue="$ISSUE_NODE_ID" \
            --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id")

          if [ -z "$ITEM_ID" ]; then
            echo "Not on the board yet, adding it."
            ITEM_ID=$(gh api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
              }' -f project="$PROJECT_ID" -f content="$ISSUE_NODE_ID" \
              --jq '.data.addProjectV2ItemById.item.id')
          fi

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: {singleSelectOptionId: $option}
              }) { projectV2Item { id } }
            }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" -f option="$OPTION" > /dev/null

          echo "Card $ITEM_ID moved to $LABEL."
