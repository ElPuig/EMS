  <line x1="34" y1="34" x2="66" y2="34" stroke="#9e1c34" stroke-width="4" stroke-linecap="round"/>
  <line x1="34" y1="43" x2="56" y2="43" stroke="#9e1c34" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="50" y2="76" stroke="#9e1c34" stroke-width="5" stroke-linecap="round"/>
